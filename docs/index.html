<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryo Container Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23020617'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%2338bdf8'%3E%E2%9D%84%3C/text%3E%3C/svg%3E" />
  <style>html,body{background:#020617}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/topbar.css" />
  <link rel="stylesheet" href="css/viewer.css" />
  <style>
    /* ── Kind tile palette ──────────────────────────────────────────────── */
    .kind-palette {
      display: flex; flex-direction: column; gap: 24px;
      padding: 24px 0 8px;
    }
    .kind-palette-group { display: flex; flex-direction: column; gap: 8px; }
    .kind-palette-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); padding: 0 4px;
    }
    .kind-tiles {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .kind-tile {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      width: 78px; padding: 12px 6px 10px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: grab; user-select: none;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .kind-tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      border-color: var(--border-strong);
    }
    .kind-tile:active { cursor: grabbing; transform: scale(.96); }
    .kind-tile.drag-over { border-color: var(--accent); background: var(--accent-bg); }
    .kind-badge {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; flex-shrink: 0;
    }
    .kind-tile-name {
      font-size: 11px; font-weight: 500; color: var(--text-secondary);
      text-align: center; line-height: 1.3; word-break: break-word;
    }

    /* drop-slot area */
    .drop-slots { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 0 4px; }
    .drop-slot {
      width: 78px; min-height: 94px; border-radius: var(--radius);
      border: 2px dashed var(--border); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      color: var(--text-muted); font-size: 11px; transition: border-color .15s, background .15s;
      cursor: default;
    }
    .drop-slot.over { border-color: var(--accent); background: var(--accent-bg); }
    .drop-slot.filled { border-style: solid; border-color: var(--border-strong); }
    .drop-slot .slot-badge { font-size: 22px; }
    .drop-slot .slot-name { font-size: 10px; color: var(--text-secondary); text-align: center; word-break: break-all; padding: 0 4px; }

    .palette-section-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .palette-section-title i { color: var(--accent); font-size: 12px; }
  </style>
</head>
<body>
  <!-- Sidebar: brand + container meta + entry tree -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">❄</div>
      <div class="brand-name">Cryo<small>Viewer</small></div>
      <button class="icon-btn brand-collapse" id="collapseBtn" title="Collapse">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </div>
    <div class="sidebar-scroll">
      <div class="nav-section" id="fileSection" hidden>
        <div class="nav-label"><span>File</span></div>
        <div class="nav-list" id="fileNode"></div>
      </div>
      <div class="side-meta" id="sideMeta" hidden></div>
      <div class="nav-section">
        <div class="nav-label"><span>Entries</span><span class="count" id="entryCount"></span></div>
        <div class="nav-list" id="tree"></div>
      </div>
    </div>
  </aside>

  <!-- Main: topbar + preview view + footer -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-btn ghost-only" id="openSidebarBtn" title="Show sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <span class="view-title" id="viewTitle"><i class="fa-solid fa-snowflake"></i> Cryo Container</span>
      </div>
      <div class="topbar-right">
        <button class="btn-primary" id="openBtn"><i class="fa-solid fa-folder-open"></i> Open .cryo</button>
        <input type="file" id="fileInput" accept=".cryo" hidden />
      </div>
    </div>

    <div class="tool-outlet">
      <section class="view active">
        <div class="tool-view">
          <div class="tool-toast" id="toast" hidden></div>
          <div class="validation" id="validation" hidden></div>
          <div class="dropzone" id="dropzone">
            <div class="flake-lg"><i class="fa-solid fa-snowflake"></i></div>
            <div class="dz-title">Drop a .cryo file</div>
            <button class="btn-primary" id="chooseBtn"><i class="fa-solid fa-folder-open"></i> Choose file</button>

            <!-- Kind tile palette -->
            <div class="kind-palette" id="kindPalette">
              <div class="palette-section-title"><i class="fa-solid fa-snowflake"></i> Cryo Kinds</div>
              <div class="kind-palette-group">
                <div class="kind-tiles" id="kosmosKindTiles"></div>
              </div>
              <div class="palette-section-title" style="margin-top:8px"><i class="fa-solid fa-layer-group"></i> Allgemein</div>
              <div class="kind-palette-group">
                <div class="kind-tiles" id="generalKindTiles"></div>
              </div>

              <div class="palette-section-title" style="margin-top:8px"><i class="fa-solid fa-inbox"></i> Drop Slots</div>
              <div class="drop-slots" id="dropSlots">
                <div class="drop-slot" data-slot="0"><i class="fa-solid fa-plus" style="font-size:18px"></i><span>Slot 1</span></div>
                <div class="drop-slot" data-slot="1"><i class="fa-solid fa-plus" style="font-size:18px"></i><span>Slot 2</span></div>
                <div class="drop-slot" data-slot="2"><i class="fa-solid fa-plus" style="font-size:18px"></i><span>Slot 3</span></div>
              </div>
            </div>
          </div>
          <div class="tool-preview" id="panel" hidden></div>
        </div>
      </section>
    </div>

    <footer class="page-footer">
      <span id="footInfo">No container loaded</span>
      <span class="mono">.cryo · random-access container</span>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
  <script>
    // ── Kind tile palette ─────────────────────────────────────────────────
    const CRYO_KINDS = [
      { kind: 'scene',      label: 'Scene',      icon: 'fa-solid fa-cube',           gradient: 'linear-gradient(135deg, #3b82f6, #2563eb)' },
      { kind: 'material',   label: 'Material',   icon: 'fa-solid fa-palette',        gradient: 'linear-gradient(135deg, #06b6d4, #0891b2)' },
      { kind: 'shader',     label: 'Shader',     icon: 'fa-solid fa-bolt',           gradient: 'linear-gradient(135deg, #a855f7, #9333ea)' },
      { kind: 'asset-pack', label: 'Asset Pack', icon: 'fa-solid fa-box-archive',    gradient: 'linear-gradient(135deg, #22c55e, #16a34a)' },
      { kind: 'script',     label: 'Script',     icon: 'fa-solid fa-scroll',         gradient: 'linear-gradient(135deg, #f97316, #ea580c)' },
      { kind: 'prefab',     label: 'Prefab',     icon: 'fa-solid fa-puzzle-piece',   gradient: 'linear-gradient(135deg, #ec4899, #db2777)' },
      { kind: 'world',      label: 'World',      icon: 'fa-solid fa-earth-americas', gradient: 'linear-gradient(135deg, #14b8a6, #0d9488)' },
      { kind: 'audio',      label: 'Audio',      icon: 'fa-solid fa-music',          gradient: 'linear-gradient(135deg, #6366f1, #4f46e5)' },
      { kind: 'texture',    label: 'Texture',    icon: 'fa-solid fa-image',          gradient: 'linear-gradient(135deg, #f59e0b, #d97706)' },
      { kind: 'animation',  label: 'Animation',  icon: 'fa-solid fa-film',           gradient: 'linear-gradient(135deg, #ef4444, #dc2626)' },
      { kind: 'ui',         label: 'UI',         icon: 'fa-solid fa-table-columns',  gradient: 'linear-gradient(135deg, #84cc16, #65a30d)' },
    ];
    const GENERAL_KINDS = [
      { kind: 'vault',    label: 'Vault',    icon: 'fa-solid fa-vault',        gradient: 'linear-gradient(135deg, #64748b, #475569)' },
      { kind: 'snapshot', label: 'Snapshot', icon: 'fa-solid fa-camera-retro', gradient: 'linear-gradient(135deg, #0ea5e9, #0284c7)' },
      { kind: 'archive',  label: 'Archive',  icon: 'fa-solid fa-file-zipper',  gradient: 'linear-gradient(135deg, #78716c, #57534e)' },
      { kind: 'dataset',  label: 'Dataset',  icon: 'fa-solid fa-database',     gradient: 'linear-gradient(135deg, #10b981, #059669)' },
      { kind: 'document', label: 'Document', icon: 'fa-solid fa-file-lines',   gradient: 'linear-gradient(135deg, #71717a, #52525b)' },
      { kind: 'model',    label: 'Model',    icon: 'fa-solid fa-brain',        gradient: 'linear-gradient(135deg, #8b5cf6, #7c3aed)' },
      { kind: 'plugin',   label: 'Plugin',   icon: 'fa-solid fa-plug',         gradient: 'linear-gradient(135deg, #f43f5e, #e11d48)' },
      { kind: 'template', label: 'Template', icon: 'fa-solid fa-clone',        gradient: 'linear-gradient(135deg, #eab308, #ca8a04)' },
    ];

    function makeTile(spec) {
      const el = document.createElement('div');
      el.className = 'kind-tile';
      el.draggable = true;
      el.dataset.kind = spec.kind;
      el.innerHTML = `
        <div class="kind-badge" style="background:${spec.gradient}"><i class="${spec.icon}"></i></div>
        <span class="kind-tile-name">${spec.label}</span>`;
      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', spec.kind);
        e.dataTransfer.setData('application/cryo-kind', JSON.stringify(spec));
        e.dataTransfer.effectAllowed = 'copy';
      });
      return el;
    }

    document.getElementById('kosmosKindTiles').append(...CRYO_KINDS.map(makeTile));
    document.getElementById('generalKindTiles').append(...GENERAL_KINDS.map(makeTile));

    // Drop slots
    document.querySelectorAll('.drop-slot').forEach(slot => {
      slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
      slot.addEventListener('dragleave', () => slot.classList.remove('over'));
      slot.addEventListener('drop', e => {
        e.preventDefault();
        slot.classList.remove('over');
        const raw = e.dataTransfer.getData('application/cryo-kind');
        if (!raw) return;
        const spec = JSON.parse(raw);
        slot.classList.add('filled');
        slot.innerHTML = `
          <div class="kind-badge slot-badge" style="background:${spec.gradient}"><i class="${spec.icon}"></i></div>
          <span class="slot-name">${spec.label}</span>`;
      });
    });
  </script>
</body>
</html>
